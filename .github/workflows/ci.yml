name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages — build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test every package that has tests
        run: |
          set -eo pipefail
          for package in Core DesignSystem Intelligence Notifications Features; do
            echo "::group::$package"
            swift test --package-path "Packages/$package"
            echo "::endgroup::"
          done
      # Two runs, on purpose, because this needs two processes rather than one ordering.
      # SwiftData binds an entity name to a class once per process, so a version 1 container —
      # which has no isLive or stateCode column — can answer the current version's queries and
      # quietly hand back archived thoughts as live. --no-parallel does not help: the classes
      # are still registered in the same process. The migration tests therefore live in their
      # own bundle and run on their own.
      - name: Test Persistence
        run: swift test --package-path Packages/Persistence --filter PersistenceTests
      - name: Test Persistence — schema migration, in its own process
        run: swift test --package-path Packages/Persistence --filter SchemaMigrationTests

  lint:
    name: Lint and format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint swiftformat
      - run: swiftlint --strict
      - run: swiftformat --lint .

  app:
    name: App — build and UI test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      # Runs the UI tests, not just a build. CapturePathTests is the executable form of
      # ADR-0008 -- a guard that only runs locally is a guard nobody enforces.
      - name: Test on a simulator
        run: |
          set -eo pipefail
          NAME=$(xcrun simctl list devices available \
                 | grep -oE '^ +iPhone [^(]+' | head -1 | sed 's/^ *//;s/ *$//')
          echo "Testing on: $NAME"
          # A second attempt covers simulator launch timeouts, which have failed a run once
          # and are an infrastructure fault rather than a test one. A genuinely broken test
          # fails both attempts, so this cannot hide a real failure.
          xcodebuild test \
            -project Fleeting.xcodeproj \
            -scheme Fleeting \
            -destination "platform=iOS Simulator,name=$NAME" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO
