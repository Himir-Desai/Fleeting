name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages — build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Core
        run: swift test --package-path Packages/Core
      - name: Build every other package
        run: |
          for package in DesignSystem Persistence Intelligence Notifications Features; do
            echo "::group::$package"
            swift build --package-path "Packages/$package"
            echo "::endgroup::"
          done

  lint:
    name: Lint and format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint swiftformat
      - run: swiftlint --strict
      - run: swiftformat --lint .

  app:
    name: App — build and UI test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      # Runs the UI tests, not just a build. CapturePathTests is the executable form of
      # ADR-0008 -- a guard that only runs locally is a guard nobody enforces.
      - name: Test on a simulator
        run: |
          set -eo pipefail
          NAME=$(xcrun simctl list devices available \
                 | grep -oE '^ +iPhone [^(]+' | head -1 | sed 's/^ *//;s/ *$//')
          echo "Testing on: $NAME"
          xcodebuild test \
            -project Fleeting.xcodeproj \
            -scheme Fleeting \
            -destination "platform=iOS Simulator,name=$NAME" \
            CODE_SIGNING_ALLOWED=NO
