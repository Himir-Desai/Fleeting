name: Fleeting

options:
  bundleIdPrefix: com.himirdesai
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  Persistence:
    path: Packages/Persistence
  Intelligence:
    path: Packages/Intelligence
  Notifications:
    path: Packages/Notifications
  Features:
    path: Packages/Features

targets:
  Fleeting:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      # The app target is the only place that may see every module at once:
      # it is the composition root, and nothing else wires concrete types.
      - package: Core
      - package: DesignSystem
      - package: Persistence
      - package: Intelligence
      - package: Notifications
      - package: Features
        product: CaptureFeature
      - package: Features
        product: InboxFeature
      - package: Features
        product: SettingsFeature
      - package: Features
        product: SharpenFeature
      - package: Features
        product: ReviewFeature
      - package: Features
        product: PlanFeature
      - target: FleetingWidgets
    entitlements:
      path: App/Fleeting.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.himirdesai.Fleeting
        # Remove this block if the signing account is not in the Developer Program.
        # The store degrades to device-local and the app is otherwise unaffected.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.himirdesai.Fleeting
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # CloudKit tells SwiftData a record changed by silent push.
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: com.himirdesai.Fleeting
            CFBundleURLSchemes: [fleeting]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.himirdesai.Fleeting
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FleetingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: Core
      - package: DesignSystem
      - package: Persistence
    entitlements:
      path: Widgets/FleetingWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.himirdesai.Fleeting
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Fleeting
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.himirdesai.Fleeting.Widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  FleetingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Fleeting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.himirdesai.Fleeting.UITests
        TEST_TARGET_NAME: Fleeting
        GENERATE_INFOPLIST_FILE: YES
